<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://geocoding-api.open-meteo.com https://api.open-meteo.com https://air-quality-api.open-meteo.com https://api.bigdatacloud.net; base-uri 'none'; form-action 'none'">
<title>Weatherly</title>
<meta name="description" content="Fast, accurate forecasts for any city: hourly charts, air quality, UV and sun times.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ffb454'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&family=Instrument+Serif&display=swap">
<link rel="stylesheet" href="css/styles.css">
<script type="module" src="js/app.js"></script>
</head>
<body data-theme="sky">
<canvas id="sky" aria-hidden="true"></canvas>
<a class="skip" href="#view">Skip to forecast</a>
<header class="bar">
  <h1 class="logo">Weatherly</h1>
  <div class="search">
    <input id="q" type="search" role="combobox" aria-expanded="false" aria-controls="sugg" aria-autocomplete="list" aria-label="Search for a city" placeholder="Search any city" autocomplete="off" spellcheck="false">
    <ul id="sugg" role="listbox" hidden></ul>
  </div>
  <button id="geo" class="btn" title="Use my location" aria-label="Use my location">Locate</button>
  <button id="refresh" class="btn" title="Refresh" aria-label="Refresh forecast">Refresh</button>
  <button id="unit" class="btn" aria-label="Switch units" aria-pressed="false">°C</button>
  <button id="theme" class="btn" aria-label="Change theme">Sky</button>
</header>
<p id="status" class="sr" role="status"></p>
<nav id="saved" class="chips" aria-label="Saved and recent places"></nav>
<main id="view" tabindex="-1"></main>
<footer class="foot">Data: Open-Meteo (forecast, air quality, geocoding). Air quality is modelled, not station-measured.</footer>
</body>
</html>
